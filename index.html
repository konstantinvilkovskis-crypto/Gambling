<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Case</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <p id="statBlock">
            <span id="ENR">energy: <span id="energy">5</span></span> 
            <span id="Mon">money: <span id="coins">1000</span></span>
            <span id="VP">VIP: <span id="VIP2">no</span></span>
        </p>

        <div id="case">
            <div id="items"></div>
            <div class="pointer"></div> </div>

        <button id="spinBtn">OPEN CASE</button>
        

        <div id="backgInv">
            <div class="invCell"></div>
            <div class="invCell"></div>
            <div class="invCell"></div>
            <div class="invCell"></div>
            <div class="invCell"></div>
            <div class="invCell"></div>
        </div>

        <div class="controls">
            <button class="sell">SELL ITEM</button>
        </div>
    </header>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>💰 STORE 💰</h2>
            <div class="donate-options">
                <button class="don-opt" data-reward="100" data-price="1">100$ — 1</button>
                <button class="don-opt" data-reward="500" data-price="5">500$ — 5</button>
                <button class="don-opt" data-reward="1000" data-price="10">1000$ — 10</button>
                <button class="don-opt" data-reward="2000" data-price="20">2000$ — 20</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
